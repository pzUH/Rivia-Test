<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CulinaPath - Eksplorasi Karir Kuliner (Teori Donald E. Super)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Konfigurasi Tema Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        neonPink: {
                            light: '#ff7edb',
                            DEFAULT: '#ff1493',
                            glow: '#ff007f',
                            dark: '#c20060'
                        },
                        cyberBg: '#0f0518'
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(255, 20, 147, 0.5), 0 0 30px rgba(255, 0, 127, 0.3)',
                        'neon-sm': '0 0 8px rgba(255, 20, 147, 0.6)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.45)',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS untuk Efek Glassmorphism & Animasi Neon -->
    <style>
        body {
            background-color: #0d0415;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 20, 147, 0.22) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(168, 85, 247, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 60%);
            background-attachment: fixed;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Glassmorphism Card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 105, 180, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glass-panel-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel-hover:hover {
            background: rgba(255, 20, 147, 0.08);
            border-color: rgba(255, 20, 147, 0.65);
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.35);
            transform: translateY(-2px);
        }

        /* Neon Text Glow */
        .text-neon-glow {
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.75), 0 0 20px rgba(255, 20, 147, 0.4);
        }

        /* Animasi Transisi Halaman */
        .view-section {
            animation: fadeSlideUp 0.4s ease-out forwards;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0415;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff1493;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-pink-600 selection:text-white">

    <!-- Notifikasi Toast / Message Box (Pengganti alert()) -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none"></div>

    <!-- Header & Navigasi Atas (Desktop & Status Sinkronisasi) -->

            <!-- Logo Brand -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="App.navigate('beranda')">

                <div>
                    <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-1">
                        Culina<span class="text-pink-400 text-neon-glow">Path</span>
                    </h1>
                    <p class="text-[10px] text-pink-200/70 tracking-wider uppercase">SMK Kuliner • Super Theory</p>

            </div>

            <!-- Navigasi Desktop -->
            <nav class="hidden md:flex items-center gap-1 lg:gap-2" id="desktop-nav">
                <button data-target="beranda" onclick="App.navigate('beranda')" class="nav-btn px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2">

                <button data-target="profil" onclick="App.navigate('profil')" class="nav-btn px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2">
                    <i class="fa-solid fa-user-chef"></i> Profil
                </button>
                <button data-target="tes" onclick="App.navigate('tes')" class="nav-btn px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2">

                </button>
                <button data-target="movie" onclick="App.navigate('movie')" class="nav-btn px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2">

                <button data-target="referensi" onclick="App.navigate('referensi')" class="nav-btn px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2">

                <button data-target="kontak" onclick="App.navigate('kontak')" class="nav-btn px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center gap-2">

            <!-- Indikator Status Hybrid (Online / Offline & Antrean Sinkronisasi) -->
            <div class="flex items-center gap-2">
                <button onclick="SyncManager.triggerManualSync()" title="Klik untuk cek sinkronisasi" id="sync-status-badge" class="px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 border transition-all cursor-pointer">
                    <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="status-text">Online</span>
                    <span id="pending-badge" class="hidden bg-pink-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Konten Utama Dinamis (Single Page Application Views) -->
    <main id="app-content" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-28 md:pb-12">
        <!-- View akan dirender di sini secara dinamis oleh JavaScript -->
    </main>

    <!-- Navigasi Bawah Mobile (Bottom Bar Touch-Friendly) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-pink-500/40 rounded-t-2xl px-1 py-1.5">
        <div class="grid grid-cols-6 gap-1 text-center" id="mobile-nav">
            <button data-target="beranda" onclick="App.navigate('beranda')" class="nav-btn-mobile flex flex-col items-center justify-center py-2 px-1 rounded-xl text-[11px] font-medium transition-all">
                <i class="fa-solid fa-house text-base mb-1"></i>
                <span>Beranda</span>
            </button>
            <button data-target="profil" onclick="App.navigate('profil')" class="nav-btn-mobile flex flex-col items-center justify-center py-2 px-1 rounded-xl text-[11px] font-medium transition-all">
                <i class="fa-solid fa-id-card text-base mb-1"></i>
                <span>Profil</span>
            </button>
            <button data-target="tes" onclick="App.navigate('tes')" class="nav-btn-mobile flex flex-col items-center justify-center py-2 px-1 rounded-xl text-[11px] font-medium transition-all">
                <i class="fa-solid fa-fire-burner text-base mb-1"></i>
                <span>Tes</span>
            </button>
            <button data-target="movie" onclick="App.navigate('movie')" class="nav-btn-mobile flex flex-col items-center justify-center py-2 px-1 rounded-xl text-[11px] font-medium transition-all">
                <i class="fa-solid fa-clapperboard text-base mb-1"></i>
                <span>Movie</span>
            </button>
            <button data-target="referensi" onclick="App.navigate('referensi')" class="nav-btn-mobile flex flex-col items-center justify-center py-2 px-1 rounded-xl text-[11px] font-medium transition-all">
                <i class="fa-solid fa-book-bookmark text-base mb-1"></i>
                <span>Referensi</span>
            </button>
            <button data-target="kontak" onclick="App.navigate('kontak')" class="nav-btn-mobile flex flex-col items-center justify-center py-2 px-1 rounded-xl text-[11px] font-medium transition-all">
                <i class="fa-solid fa-paper-plane text-base mb-1"></i>
                <span>Kontak</span>
            </button>
        </div>
    </nav>

    <!-- Footer Desktop -->
    <footer class="hidden md:block border-t border-pink-500/20 py-5 text-center text-xs text-pink-200/60">
        <p>© 2026 <span class="text-pink-400 font-semibold">CulinaPath</span> — Aplikasi Bimbingan Karir Siswa SMK Tata Boga & Kuliner (Fase Eksplorasi Donald E. Super).</p>
    </footer>

    <!-- Logika Aplikasi Modular (100% Client-Side) -->
    <script>
        /**
         * 1. MODUL PENYIMPANAN & SINKRONISASI HYBRID (Offline-First)
         * Mengelola penyimpanan ke localStorage, deteksi jaringan, dan antrean sinkronisasi otomatis.
         */
        const SyncManager = {
            STORAGE_KEY_RESULTS: 'culinapath_quiz_results_v1',
            STORAGE_KEY_QUEUE: 'culinapath_sync_queue_v1',
            STORAGE_KEY_PROFILE: 'culinapath_student_profile_v1',

            init() {
                window.addEventListener('online', () => this.handleNetworkChange(true));
                window.addEventListener('offline', () => this.handleNetworkChange(false));
                this.updateStatusUI();
                
                // Cek antrean saat aplikasi pertama kali dimuat jika sedang online
                if (navigator.onLine) {
                    this.processQueue();
                }
            },

            handleNetworkChange(isOnline) {
                this.updateStatusUI();
                if (isOnline) {
                    UI.showToast('Koneksi terhubung kembali! Memeriksa data tertunda...', 'success');
                    this.processQueue();
                } else {
                    UI.showToast('Mode Offline aktif. Hasil tes akan disimpan lokal di perangkat.', 'warning');
                }
            },

            updateStatusUI() {
                const isOnline = navigator.onLine;
                const badge = document.getElementById('sync-status-badge');
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('status-text');
                const pendingBadge = document.getElementById('pending-badge');
                const queue = this.getQueue();

                if (isOnline) {
                    badge.className = 'px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 transition-all cursor-pointer';
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
                    text.textContent = 'Online';
                } else {
                    badge.className = 'px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 border border-amber-500/40 bg-amber-500/10 text-amber-300 transition-all cursor-pointer';
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
                    text.textContent = 'Offline';
                }

                if (queue.length > 0) {
                    pendingBadge.textContent = `${queue.length} tertunda`;
                    pendingBadge.classList.remove('hidden');
                } else {
                    pendingBadge.classList.add('hidden');
                }
            },

            saveQuizResult(resultObj) {
                try {
                    // Simpan ke riwayat lokal utama
                    const history = this.getHistory();
                    history.unshift(resultObj);
                    localStorage.setItem(this.STORAGE_KEY_RESULTS, JSON.stringify(history));

                    // Masukkan ke antrean sinkronisasi cloud
                    const queue = this.getQueue();
                    queue.push(resultObj);
                    localStorage.setItem(this.STORAGE_KEY_QUEUE, JSON.stringify(queue));

                    this.updateStatusUI();

                    if (navigator.onLine) {
                        this.processQueue();
                    } else {
                        UI.showToast('Tersimpan secara lokal (Offline). Akan diunggah otomatis saat online.', 'info');
                    }
                } catch (e) {
                    console.error('Gagal menyimpan ke localStorage:', e);
                    UI.showToast('Terjadi kesalahan penyimpanan lokal.', 'error');
                }
            },

            processQueue() {
                const queue = this.getQueue();
                if (queue.length === 0) return;

                // Simulasi pengiriman asynchronous ke server / Google Sheets / Cloud DB
                setTimeout(() => {
                    try {
                        const history = this.getHistory();
                        const syncedIds = queue.map(item => item.id);
                        
                        // Tandai status synced di riwayat
                        const updatedHistory = history.map(item => {
                            if (syncedIds.includes(item.id)) {
                                return { ...item, synced: true, syncedAt: new Date().toLocaleTimeString('id-ID') };
                            }
                            return item;
                        });

                        localStorage.setItem(this.STORAGE_KEY_RESULTS, JSON.stringify(updatedHistory));
                        localStorage.setItem(this.STORAGE_KEY_QUEUE, JSON.stringify([]));
                        
                        this.updateStatusUI();
                        UI.showToast(`${queue.length} data hasil eksplorasi karir berhasil disinkronkan!`, 'success');
                        
                        // Refresh tampilan jika sedang di halaman Tes atau Profil
                        if (App.currentView === 'tes' || App.currentView === 'profil') {
                            App.renderView(App.currentView);
                        }
                    } catch (err) {
                        console.error('Sync gagal:', err);
                    }
                }, 1200);
            },

            triggerManualSync() {
                if (!navigator.onLine) {
                    UI.showToast('Anda sedang Offline. Hubungkan internet untuk menyinkronkan data.', 'warning');
                    return;
                }
                const queue = this.getQueue();
                if (queue.length === 0) {
                    UI.showToast('Semua data sudah tersinkronisasi dengan aman.', 'success');
                } else {
                    UI.showToast('Menyinkronkan data tertunda...', 'info');
                    this.processQueue();
                }
            },

            getHistory() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY_RESULTS)) || [];
                } catch {
                    return [];
                }
            },

            getQueue() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY_QUEUE)) || [];
                } catch {
                    return [];
                }
            },

            getProfile() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY_PROFILE)) || {
                        nama: 'Alya Putri Maharani',
                        usia: '16 Tahun',
                        kelas: 'XI Kuliner 2',
                        sekolah: 'SMK Negeri Pariwisata & Tata Boga',
                        minatUtama: 'Pastry & Bakery Artisan'
                    };
                } catch {
                    return {};
                }
            },

            saveProfile(profileData) {
                localStorage.setItem(this.STORAGE_KEY_PROFILE, JSON.stringify(profileData));
                UI.showToast('Profil siswa berhasil diperbarui!', 'success');
            }
        };

        /**
         * 2. BANK DATA INSTRUMEN TES EKSPLORASI KARIR (TEORI DONALD E. SUPER)
         * Disesuaikan khusus untuk Siswa SMK Kuliner usia 16-17 tahun (Tahap Exploration: Crystallizing, Specifying, Implementing).
         */
        const QuizData = {
            questions: [
                {
                    id: 1,
                    dimension: 'Self-Concept (Konsep Diri Kuliner)',
                    text: 'Saat praktik di dapur sekolah (kitchen lab), peran apa yang paling membuatmu merasa percaya diri dan bersemangat?',
                    options: [
                        { text: 'Merancang tampilan plating dan menciptakan resep fusion baru (R&D / Chef Kreatif)', score: 4, track: 'Culinary Arts & Innovation' },
                        { text: 'Menimbang bahan dengan presisi tinggi untuk membuat roti, cake, dan dessert (Pastry & Bakery)', score: 4, track: 'Pastry & Bakery Specialist' },
                        { text: 'Mengatur alur kerja tim dapur agar pesanan keluar tepat waktu (Kitchen Management)', score: 3, track: 'F&B Management & Hospitality' },
                        { text: 'Menghitung modal bahan baku dan merencanakan strategi jualan produk makanan (Foodpreneur)', score: 4, track: 'Culinary Entrepreneurship' }
                    ]
                },
                {
                    id: 2,
                    dimension: 'Crystallizing (Kristalisasi Pilihan Karir)',
                    text: 'Di usia 16-17 tahun ini, bagaimana gambaran rencana karirmu setelah lulus dari SMK jurusan Kuliner?',
                    options: [
                        { text: 'Sudah punya target spesifik: ingin bekerja di hotel bintang 5 atau kapal pesiar internasional', score: 4, track: 'Culinary Arts & Innovation' },
                        { text: 'Ingin membuka usaha café, toko kue online, atau franchise kuliner milik sendiri', score: 4, track: 'Culinary Entrepreneurship' },
                        { text: 'Ingin melanjutkan kuliah D4/S1 Tata Boga, Teknologi Pangan, atau Manajemen Perhotelan', score: 3, track: 'F&B Management & Hospitality' },
                        { text: 'Masih mencoba berbagai divisi dapur untuk menemukan spesialisasi yang paling cocok', score: 2, track: 'Pastry & Bakery Specialist' }
                    ]
                },
                {
                    id: 3,
                    dimension: 'Specifying (Spesifikasi Kompetensi & PKL)',
                    text: 'Menghadapi program Praktik Kerja Lapangan (PKL) / Magang industri, langkah persiapan apa yang sudah kamu lakukan?',
                    options: [
                        { text: 'Membuat portofolio foto hasil masakan dan melatih kecepatan dasar memotong (knife skills)', score: 4, track: 'Culinary Arts & Innovation' },
                        { text: 'Riset standar kebersihan industri (HACCP) dan melatih teknik dekorasi kue modern', score: 4, track: 'Pastry & Bakery Specialist' },
                        { text: 'Mempelajari bahasa Inggris perhotelan dan etika pelayanan tamu (hospitality)', score: 3, track: 'F&B Management & Hospitality' },
                        { text: 'Mulai mencoba berjualan pre-order (PO) camilan di sekolah untuk melatih mental bisnis', score: 4, track: 'Culinary Entrepreneurship' }
                    ]
                },
                {
                    id: 4,
                    dimension: 'Career Adaptability (Adaptabilitas Dapur)',
                    text: 'Jika saat ujian praktik masakanmu mengalami kegagalan (misal: saus pecah atau adonan bantat) 20 menit sebelum penilaian, apa reaksimu?',
                    options: [
                        { text: 'Tetap tenang, menganalisis penyebab kesalahan suhu/bahan, lalu segera membuat ulang versi cepat', score: 4, track: 'Culinary Arts & Innovation' },
                        { text: 'Memodifikasi tekstur menjadi komponen dessert baru yang tetap layak saji dan estetik', score: 4, track: 'Pastry & Bakery Specialist' },
                        { text: 'Meminta masukan cepat dari rekan kelompok/guru untuk penyelamatan penyajian tepat waktu', score: 3, track: 'F&B Management & Hospitality' },
                        { text: 'Mencatat evaluasi kegagalan tersebut agar tidak merugi jika diproduksi untuk dijual', score: 3, track: 'Culinary Entrepreneurship' }
                    ]
                },
                {
                    id: 5,
                    dimension: 'Implementing (Implementasi Langkah Karir)',
                    text: 'Aktivitas di luar jam pelajaran sekolah mana yang paling sering kamu ikuti untuk mendukung karir kulinermu?',
                    options: [
                        { text: 'Mengikuti lomba memasak (LKS SMK) atau menonton dokumenter teknik memasak profesional', score: 4, track: 'Culinary Arts & Innovation' },
                        { text: 'Mengikuti kelas/tutorial baking kekinian dan tren dekorasi pastry di media sosial', score: 4, track: 'Pastry & Bakery Specialist' },
                        { text: 'Aktif di organisasi sekolah/OSIS untuk melatih kepemimpinan dan komunikasi tim', score: 3, track: 'F&B Management & Hospitality' },
                        { text: 'Belajar food photography dan pemasaran digital (TikTok/Instagram) untuk promosi produk makanan', score: 4, track: 'Culinary Entrepreneurship' }
                    ]
                }
            ],

            getStageInterpretation(totalScore) {
                if (totalScore >= 18) {
                    return {
                        stage: 'Tahap Specifying & Implementing (Kematangan Karir Tinggi)',
                        badgeColor: 'text-emerald-300 border-emerald-400/50 bg-emerald-500/20',
                        summary: 'Selamat! Di usia 16-17 tahun, kamu telah melampaui fase eksplorasi awal dengan sangat baik. Konsep diri kulinermu sudah terarah, dan kamu siap mengimplementasikan keahlianmu menuju PKL industri maupun wirausaha kuliner.',
                        recommendation: 'Fokuslah menyusun portofolio digital masakanmu, ikuti sertifikasi kompetensi BNSP bidang Tata Boga, dan pilih tempat PKL yang sesuai dengan spesialisasi impianmu.'
                    };
                } else if (totalScore >= 13) {
                    return {
                        stage: 'Tahap Crystallizing (Pengkristalan Minat Karir)',
                        badgeColor: 'text-pink-300 border-pink-400/50 bg-pink-500/20',
                        summary: 'Kamu sedang berada tepat pada fase inti perkembangan karir Donald E. Super untuk remaja usia 16-17 tahun! Kamu mulai mengenali kekuatanmu di dapur, namun masih membutuhkan penguatan pada satu jalur spesialisasi utama.',
                        recommendation: 'Eksplorasi lebih dalam antara divisi Hot Kitchen, Pastry, atau Manajemen F&B melalui diskusi dengan guru produktif dan alumni SMK.'
                    };
                } else {
                    return {
                        stage: 'Tahap Tentatif / Eksplorasi Awal',
                        badgeColor: 'text-amber-300 border-amber-400/50 bg-amber-500/20',
                        summary: 'Kamu masih dalam proses mengenal potensi dirimu di dunia kuliner. Hal ini sangat wajar di usia SMK! Jadikan setiap jam praktik di lab dapur sebagai ajang mencoba berbagai peran.',
                        recommendation: 'Mulailah mencatat jenis praktik dapur yang paling kamu nikmati dan tonton referensi film/dokumenter kuliner untuk memantik inspirasi karirmu.'
                    };
                }
            }
        };

        /**
         * 3. KOMPONEN UI & NOTIFIKASI
         */
        const UI = {
            showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                const styles = {
                    success: 'border-emerald-400/60 bg-emerald-950/85 text-emerald-200',
                    warning: 'border-amber-400/60 bg-amber-950/85 text-amber-200',
                    error: 'border-rose-500/60 bg-rose-950/85 text-rose-200',
                    info: 'border-pink-400/60 bg-pink-950/85 text-pink-100'
                };

                const icons = {
                    success: 'fa-circle-check text-emerald-400',
                    warning: 'fa-triangle-exclamation text-amber-400',
                    error: 'fa-circle-xmark text-rose-400',
                    info: 'fa-sparkles text-pink-400'
                };

                toast.className = `pointer-events-auto glass-panel border ${styles[type]} px-4 py-3 rounded-2xl shadow-lg flex items-start gap-3 text-xs font-medium transform transition-all duration-300 translate-x-4 opacity-0`;
                toast.innerHTML = `
                    <i class="fa-solid ${icons[type]} text-base mt-0.5"></i>
                    <p class="leading-relaxed">${message}</p>
                `;

                container.appendChild(toast);
                requestAnimationFrame(() => {
                    toast.classList.remove('translate-x-4', 'opacity-0');
                });

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-x-4');
                    setTimeout(() => toast.remove(), 300);
                }, 3800);
            }
        };

                    }
                });
            },

            renderView(viewName) {
                const container = document.getElementById('app-content');
                switch (viewName) {
                    case 'beranda':
                        container.innerHTML = Views.beranda();
                        break;
                    case 'profil':
                        container.innerHTML = Views.profil();
                        break;
                    case 'tes':
                        container.innerHTML = Views.tes();
                        break;
                    case 'movie':

                        break;
                    case 'referensi':

            // Handler Interaksi Tes Kuis
            startQuiz() {
                this.quizState = { step: 1, answers: [] };
                this.renderView('tes');
            },

            selectAnswer(optionIndex) {
                const currentQ = QuizData.questions[this.quizState.step - 1];
                const chosenOption = currentQ.options[optionIndex];
                
                this.quizState.answers.push({
                    questionId: currentQ.id,
                    dimension: currentQ.dimension,
                    chosenText: chosenOption.text,
                    score: chosenOption.score,
                    track: chosenOption.track
                });

                if (this.quizState.step < QuizData.questions.length) {
                    this.quizState.step++;
                    this.renderView('tes');
                } else {
                    this.finishQuiz();
                }
            },

            finishQuiz() {
                const totalScore = this.quizState.answers.reduce((acc, item) => acc + item.score, 0);
                const maxScore = QuizData.questions.length * 4;
                const percentage = Math.round((totalScore / maxScore) * 100);

                // Hitung jalur karir kuliner dominan
                const trackCounts = {};
                this.quizState.answers.forEach(ans => {
                    trackCounts[ans.track] = (trackCounts[ans.track] || 0) + 1;
                });
                const dominantTrack = Object.keys(trackCounts).reduce((a, b) => trackCounts[a] > trackCounts[b] ? a : b);
                const interpretation = QuizData.getStageInterpretation(totalScore);

                const resultRecord = {
                    id: 'RES-' + Date.now(),
                    date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    totalScore,
                    maxScore,
                    percentage,
                    dominantTrack,
                    stageTitle: interpretation.stage,
                    synced: false
                };

                // Simpan via Hybrid SyncManager
                SyncManager.saveQuizResult(resultRecord);
                this.quizState.lastResult = resultRecord;
                this.quizState.step = 99;
                this.renderView('tes');
            },
